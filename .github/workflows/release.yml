name: release

# The owner's command, run on `main`. Takes the newest green candidate from the
# standing release draft: no rebuild, and the tag goes on the candidate's commit.
# A failure costs a rerun, never a burnt version, because the tag is created
# last. The version is bumped in a pull request, so there is no bump step.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch, sign and check, but publish nothing
        type: boolean
        default: false
      notes:
        description: The release text's first paragraph, and what the update offer says (optional)
        type: string
        default: ''

permissions:
  contents: read

# A release never cancels and never overlaps another.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The owner approves each release here; the Environment is limited to main
    # and holds the signing key.
    environment: release
    permissions:
      contents: write
      issues: write
    # Shared with main's candidate job: see main.yml.
    concurrency:
      group: candidate
      cancel-in-progress: false
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      RELEASE_NOTES: ${{ inputs.notes }}
      CI_BRANCH: main
      # What the builds compiled in, and so what the manifests are signed for.
      KIKU_RELEASES: ${{ vars.KIKU_RELEASES || format('https://github.com/{0}/releases', github.repository) }}
    steps:
      # The release scripts run from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: false
      # Puts the candidate's commit in candidate/ and its files in
      # candidate/dist, every hash checked.
      - id: candidate
        name: mise run ci:fetch
        run: mise run ci:fetch
      # `published` is true only on a rerun of a release that published and
      # then failed: only the image and the models are left.
      # The candidate's own tree signs its files, so the task matches them.
      - name: mise run publish
        if: ${{ steps.candidate.outputs.published != 'true' }}
        working-directory: candidate
        run: mise run publish
        # Only the candidate's own mise.toml: not main's, one folder up.
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}
          KIKU_SIGNING_KEY: ${{ secrets.KIKU_SIGNING_KEY }}
          KIKU_PRIVATE_WORDS: ${{ secrets.KIKU_PRIVATE_WORDS }}
      - name: mise run ci:publish
        if: ${{ steps.candidate.outputs.published != 'true' }}
        run: mise run ci:publish ${{ inputs.dry_run && '--dry-run' || '' }}

  # The Linux model host's Docker image, from the tarball the release published.
  image:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: false
      - name: mise run tarball
        run: mise run tarball
      # A new package starts private: the owner makes it public once, in the package's settings.
      - name: mise run image
        run: mise run image

  # Model files the catalog serves from here, made once and published if missing.
  models:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: false
      - name: mise run models
        run: mise run models
        env:
          GH_TOKEN: ${{ github.token }}
