# Tool pins and the project's CI tasks (docs/context/ci.md). The shared ci:* tasks come from
# .github/ci/tasks.toml. Every CI step is one `mise run <task>`.

[tools]
python = "3.14.10"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it finds one, so it is pinned
# too: unpinned, a local lint and CI's could check different things.
shellcheck = "0.11.0"
# The release scripts (scripts/release.py, make-icon.py, make-fp16.py) run with `uv run`.
uv = "0.13.8"

[task_config]
includes = [".github/ci/tasks.toml"]

[tasks.setup]
description = "Once per checkout: install the git hooks that keep private files and words out of commits and pushes"
run = "python scripts/ci/hooks.py install"

[tasks.version]
description = "Print the version in Cargo.toml's [workspace.package]"
run = "python scripts/ci/version.py"

[tasks.bump]
description = "bump <x.y.z>: write the version into Cargo.toml and Cargo.lock"
run = "python scripts/ci/version.py bump"

[tasks.check]
description = "Everything cheap that gives the same answer every time: privacy gate, workflow lint, switches"
run = [
  "python scripts/ci/privacy.py",
  "python -m unittest discover -s scripts/ci",
  { task = "ci:lint" },
  { task = "ci:switches" },
]

[tasks.engine]
description = "The Linux engine's tests in the Linux build image (Docker; on Windows through Docker Desktop)"
run = "python scripts/ci/engine.py"

[tasks.windows]
description = "The Windows workspace tests (and the snapshots when KIKU_SNAPSHOTS names a folder); fetches the runtime if third_party lacks it"
run = "echo windows: this task runs on Windows only && exit 1"
run_windows = "python scripts/ci/windows.py"

[tasks.build]
description = "Test and build this runner's release target into dist/: the installer on Windows, the tarball (and NOTES.md) on Linux"
run = "python scripts/ci/build_linux.py"
run_windows = "python scripts/ci/build_windows.py"

[tasks.smoke]
description = "Test the files build made: install test on Windows, the unpacked tarball on clean Ubuntu and Debian on Linux"
run = "python scripts/ci/smoke_linux.py"
run_windows = "python scripts/ci/smoke_windows.py"

[tasks.publish]
description = "Release, in the candidate's tree: sign the update manifests, make the stable-name copies, gate them"
run = "python scripts/ci/publish.py"

[tasks.tarball]
description = "Download the published release's Linux tarball into image-context/"
run = "python scripts/ci/tarball.py"

[tasks.image]
description = "Build the Docker image from image-context/ and push it to ghcr.io (DRY_RUN=1 builds only)"
run = "python scripts/ci/image.py"

[tasks.models]
description = "Make and publish the model files the catalog serves from the models-v1 release, if missing"
run = "echo models: this task runs on Windows only && exit 1"
run_windows = "pwsh -File scripts/publish-models.ps1"
