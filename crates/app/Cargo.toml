[package]
name = "kiku"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kiku-core = { path = "../core" }
wasapi = "0.26"
windows = { version = "0.62", features = ["Foundation_Numerics", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
windows-numerics = "0.3"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
serde_json = "1"
sysinfo = "0.40.0"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_ProcessStatus", "Win32_System_WindowsProgramming", "Win32_UI_Input"] }
