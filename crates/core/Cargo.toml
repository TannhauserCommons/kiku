[package]
name = "kiku-core"
description = "Everything that doesn't depend on the OS: engines, models, captions, history, settings, the MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
ed25519-dalek = { version = "2", default-features = false }
flate2 = "1"
fs4 = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
sha2 = "0.10"
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
