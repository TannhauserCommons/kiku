[package]
name = "kiku-core"
description = "Everything that doesn't depend on the OS: engines, models, captions, history, settings, the MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
ed25519-dalek = { version = "2", default-features = false }
flate2 = "1"
fs4 = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }
